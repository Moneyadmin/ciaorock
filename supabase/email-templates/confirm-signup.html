<!--
  Supabase → Authentication → Emails → Templates → "Confirm signup":
  incolla questo HTML nel corpo del messaggio.
  Oggetto consigliato: Conferma il tuo account Ciao Rock
  Il codice ({{ .Token }}, 6–10 cifre secondo l'impostazione "Email OTP Length" di Supabase) serve per entrare anche se il link si apre in un altro browser.
-->
<div style="margin:0;padding:24px;background:#f5f3fa;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#221d33">
  <div style="max-width:520px;margin:0 auto;background:#ffffff;border-radius:24px;padding:32px;border:1px solid #e6e1f2">
    <div style="width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,#7b5cff,#ff4fa3);color:#fff;font-size:28px;line-height:56px;text-align:center;font-weight:800">&#9786;</div>
    <h1 style="font-size:26px;line-height:1.2;margin:20px 0 8px">Benvenuto in Ciao Rock!</h1>
    <p style="font-size:16px;line-height:1.5;margin:0 0 16px">Conferma la tua email toccando il pulsante, oppure scrivi questo codice nell'app:</p>
    <p style="font-size:34px;letter-spacing:8px;font-weight:800;text-align:center;margin:0 0 20px;color:#6a4bff">{{ .Token }}</p>
    <a href="{{ .ConfirmationURL }}" style="display:block;text-align:center;background:#6a4bff;color:#ffffff;text-decoration:none;font-weight:800;font-size:16px;padding:16px;border-radius:16px">
      Entra in Ciao Rock
    </a>
    <p style="font-size:13px;line-height:1.5;color:#6b6485;margin:24px 0 0">
      Link e codice valgono per poco tempo e una volta sola. Se non hai chiesto tu questa email, ignorala.
    </p>
  </div>
</div>
